name: Deploy UAT (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-uat" to confirm'
        required: true

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_DCM_USER: ${{ secrets.SNOWFLAKE_DCM_USER }}
  SNOWFLAKE_DCM_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DCM_PRIVATE_KEY }}
  SNOWFLAKE_DBT_USER: ${{ secrets.SNOWFLAKE_DBT_USER }}
  SNOWFLAKE_DBT_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}

jobs:
  deploy-uat:
    if: github.event.inputs.confirm == 'deploy-uat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install "snowflake-cli>=3.16" "dbt-snowflake~=1.9.0"

      - name: Write service-account keys to files
        run: |
          echo "$SNOWFLAKE_DCM_PRIVATE_KEY" > /tmp/dcm_rsa_key.p8
          echo "$SNOWFLAKE_DBT_PRIVATE_KEY" > /tmp/dbt_rsa_key.p8

      - name: Configure Snow CLI
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.default]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_DCM_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/tmp/dcm_rsa_key.p8"
          role = "DCM_DEPLOYER"
          warehouse = "TRANSFORM_WH_UAT"
          EOF
          chmod 0600 ~/.snowflake/config.toml

      - name: DCM Deploy
        working-directory: dcm
        run: |
          snow dcm deploy MGMT_DB_UAT.DCM.COST_GOVERNANCE_DCM_UAT \
            --target UAT \
            --connection default

      - name: Post-deploy Future Grants
        run: |
          snow sql -q "CALL MGMT_DB_UAT.DCM.SETUP_FUTURE_GRANTS('UAT')" \
            --connection default

      - name: Generate dbt profiles for CI/CD
        run: |
          cat > dbt/profiles.yml << EOF
          default:
            target: uat
            outputs:
              uat:
                type: snowflake
                account: $SNOWFLAKE_ACCOUNT
                user: $SNOWFLAKE_DBT_USER
                private_key_path: /tmp/dbt_rsa_key.p8
                role: TRANSFORM_ROLE_UAT
                database: MGMT_DB_UAT
                warehouse: TRANSFORM_WH_UAT
                schema: COST_GOVERNANCE
                threads: 4
          EOF

      - name: dbt Build
        run: dbt build --project-dir dbt --profiles-dir dbt --target uat
